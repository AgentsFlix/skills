      <g fill="#d7b45e" opacity=".7"><rect x="40" y="46" width="142" height="14" rx="7"/><rect x="40" y="93" width="302" height="12" rx="6"/><rect x="68" y="127" width="262" height="12" rx="6"/><rect x="68" y="161" width="300" height="12" rx="6"/></g>
      <g transform="translate(40 218)"><rect width="360" height="62" rx="16" fill="#262626"/><circle cx="32" cy="31" r="10" fill="#d7b45e"/><rect x="58" y="22" width="190" height="18" rx="9" fill="#eee5d0" opacity=".84"/><text x="316" y="39" fill="#d7b45e" font-family="monospace" font-size="24" text-anchor="middle">84%</text></g>
    </g>
