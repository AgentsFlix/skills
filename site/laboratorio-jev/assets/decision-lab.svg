      <path d="M66 365c55-22 112-27 166-14 60 15 121 11 187 29 33 9 30 32-4 39-89 19-244 20-333-3-42-11-49-37-16-51Z" fill="url(#hat)" stroke="#bd8052" stroke-width="8" stroke-linejoin="round"/>
