    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3ead4"/><stop offset="1" stop-color="#cfc2a8"/></linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a06943"/><stop offset="1" stop-color="#4b291e"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="25" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="72" fill="url(#bg)"/>
  <circle cx="512" cy="390" r="330" fill="#6c3545" opacity=".16"/>
  <g fill="#d7b45e" opacity=".8"><circle cx="150" cy="176" r="7"/><circle cx="835" cy="176" r="5"/><circle cx="878" cy="384" r="8"/><circle cx="204" cy="448" r="5"/><path d="m764 265 8 18 19 8-19 8-8 19-8-19-19-8 19-8 8-18Z"/></g>
  <g filter="url(#shadow)">
