<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">O Chapéu Decide</title>
  <desc id="desc">Um chapéu mágico diante de dois painéis de código, representando uma decisão feita a partir de estado e perguntas tipadas.</desc>
  <defs>
