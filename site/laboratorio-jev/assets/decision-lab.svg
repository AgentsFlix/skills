      <g fill="#624d39" opacity=".68"><rect x="38" y="92" width="334" height="13" rx="6"/><rect x="66" y="126" width="300" height="13" rx="6"/><rect x="66" y="160" width="245" height="13" rx="6"/><rect x="66" y="194" width="318" height="13" rx="6"/><rect x="38" y="245" width="280" height="13" rx="6"/><rect x="66" y="279" width="324" height="13" rx="6"/></g>
      <g fill="#6c3545" font-family="monospace" font-size="24" font-weight="700"><text x="38" y="112">{</text><text x="38" y="214">}</text></g>
    </g>
    <g transform="translate(510 480) rotate(4 220 180)">
